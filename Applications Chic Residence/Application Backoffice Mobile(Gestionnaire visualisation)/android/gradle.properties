org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Path contains accented characters (ainé): the Kotlin daemon fails to
# spawn when the working dir has non-ASCII chars, so keep compilation in-process.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=true
org.gradle.parallel=true
android.overridePathCheck=true
