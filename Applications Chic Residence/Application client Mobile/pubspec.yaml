name: chic_residence_mobile
description: "Chic Residence - Reservation de residences meublees a Abidjan (style Airbnb)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.7.0

  # UI / Media
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  table_calendar: ^3.1.2

  # System
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.0

  # Firebase (push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/logo-medallion.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF3E8"
  adaptive_icon_foreground: "assets/branding/logo-icon.png"
  adaptive_icon_foreground_inset: 16

